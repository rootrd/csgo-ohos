# DXVK config for the 2019 port (pushed as <2019 root>/dxvk.conf by overlay2019.sh; the 2017 root keeps its own).

# OHOS/Maleoon: 驱动 vkCreateDevice 对任何非零 core feature 报 FEATURE_NOT_PRESENT，
# 零 feature 兜底后用本掩码按 VkPhysicalDeviceFeatures 位序试探最小集。
# bit0=robustBufferAccess bit22=textureCompressionBC
csgoVkFeatureMask = 0x4C398F

# KISAK-ANDROID: carried over from the 2017 root. NOTE: DXVK 1.9.2 only understands true/false/auto here, so "strict"
# is inert (config.cpp) -- it only becomes real after an upgrade to 1.10+; re-check it then instead of copying it along.
d3d9.floatEmulation = False

# KISAK-ANDROID 2026-09-26: present in step with the panel instead of MAILBOX + fps_max 300 (frames above the refresh
# rate were rendered and thrown away). The panel is 120 Hz; ColorOS pinned the game window to 60 Hz until MainActivity
# started requesting the fastest mode (csgo-apk, 2026-09-26). PKR110 battery power (charger unplugged), de_dust2 at
# 120 Hz: light view 120 fps / 2.6 W, heavy view (CT roof, GPU bound) 61 fps / 4.6 W; `fps_max 60` saves ~1.1 W in light
# views. Android offers no FIFO_RELAXED, so this is FIFO; maxFrameLatency 1 keeps the queue (input latency) to one
# frame. For the old behaviour set d3d9.presentInterval = 0. (An earlier note here quoted charger-input watts, which
# include the charging path -- wrong.)
# 2026-09-26 13:15: no longer forced here -- the game's own 垂直同步 setting (mat_vsync, video settings screen) decides,
# on by default on Android (videocfg.cpp); forcing it made that setting do nothing (user: 设置里关于图形的设置都要生效).
# d3d9.presentInterval = 1
d3d9.tearFree = False
d3d9.maxFrameLatency = 1

# KISAK-ANDROID 2026-09-26: drop the system-memory copy of each managed texture once it is uploaded, except textures
# the game keeps updating (font pages, HDR lightmap pages, ...: they are read back once and keep their copy from then
# on, see d3d9.kisakEvictManagedOnce in dxvk2019). PKR110 de_dust2: PSS 2964 -> 2550 MB, Gfx dev 1192 -> 812 MB, zram
# swap 434 -> ~0 MB; fps and frame-time spikes unchanged (plain d3d9.evictManagedOnUnlock read back on every such lock:
# per-2 s worst frame 16 -> 23 ms).
d3d9.kisakEvictManagedOnce = True

# KISAK-ANDROID 2026-09-26 09:00: give DXVK memory chunks back to the driver (dxvk2019 e1133fc: empty chunks freed after
# staying empty 30 s, upload copies in their own 16 MB pool) and use 32 MB instead of 128 MB regular chunks (bceb4c9), so
# the free space left after level load ends up in chunks that become empty. PKR110 de_dust2, same roof view:
# kgsl 2819 -> 2073 MB, PSS 2436 -> 2147 MB; fps 61.1 -> 61.3, 360-degree sweep worst frame per 2 s median 16.9 / max
# 24.0 ms -> 16.9 / 24.4 ms, 0 windows over 25 ms either way; screenshot identical (mean pixel diff 0.01).
dxvk.kisakFreeEmptyChunks = True
dxvk.kisakChunkSizeMB = 32
