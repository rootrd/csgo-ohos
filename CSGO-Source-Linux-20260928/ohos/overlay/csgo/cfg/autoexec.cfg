// KISAK-ANDROID (2019 full port): platform settings only. Game rules, bots, loadouts and HUD
// options come from the 2019 game itself (gamemode_*.cfg, config_default.cfg, the Panorama
// settings pages), exactly as on PC. Test-only settings belong to the test scripts (they send
// them through kisak_cmd.txt), not here. Source: D:/csgoport/_port2019/cfg2019/autoexec.cfg,
// installed by _port2019/overlay2019.sh. The 2017-era test autoexec is kept in _kisak_test_cfgs/.

con_enable 1

// --- keys sent by the on-screen controls (csgo-apk TouchControls.java) ---------------------
// config_default.cfg binds these like PC already (w/a/s/d, SPACE, CTRL, SHIFT, r, e, g, b, TAB,
// ESCAPE, 1-5). The two touch buttons that stand in for the mouse buttons send keys (a synthetic
// mouse button carries an absolute position that snaps the view), so they need their own binds:
bind "j" "+attack"      // FIRE  (PC: MOUSE1)
bind "k" "+attack2"     // ADS   (PC: MOUSE2; config_default binds k to +voicerecord)
bind "f" "+lookatweapon" // 检视 (CS:NO 0.1.0 touch button; also the PC default, kept here against a stale config.cfg)
bind "o" "csno_nextweapon" // 切枪 (CS:NO 0.2.3 touch button): next slot that holds something
bind "m" "teammenu"       // 阵营 (0.2.3 touch button; the PC default, kept against a stale config.cfg)
bind "`" "toggleconsole"   // 控制台 (0.2.3 touch button; the PC default)

// Touch look needs nothing here: in the 2019 code m_rawinput 1 (the default) reads the same SDL
// deltas as m_rawinput 0 (inputsystem GetRawMouseAccumulators -> CSDLMgr::GetMouseDelta).

// The engine runs config.cfg a second time when the player profile finishes loading
// (host.cpp CHostSubscribeForProfileEvents: OnProfileDataLoaded -> Host_ReadConfiguration), after
// this file -- and config.cfg starts with "unbindall". Save the binds above into it, the usual
// PC practice, so that reload keeps them.
host_writeconfig
