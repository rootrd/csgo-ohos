<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
	<!-- OHOS sandbox fontconfig: scan ONLY the game's own font directories.
	     The default config points at /usr/share/fonts (absent) and Android's
	     /system/fonts (208 files, slow and irrelevant); scanning those under
	     the app sandbox made FcFontList spin during vgui font init. -->
	<dir>/data/storage/el2/base/haps/entry/files/csgo/platform/vgui/fonts</dir>
	<dir>/data/storage/el2/base/haps/entry/files/csgo/csgo/panorama/fonts</dir>
	<cachedir>/data/storage/el2/base/haps/entry/files/fontconfig-cache</cachedir>
	<include ignore_missing="yes">/data/storage/el2/base/haps/entry/files/csgo/csgo/panorama/fonts/conf.d</include>
</fontconfig>
